name: 'Remove AMI Test Copies'
description: 'Deregisters the test copies publish-ami made in this workflow run and deletes their snapshots.'
inputs:
  regions:
    description: 'Comma-separated list of regions to clean up'
    required: true
  python_version:
    description: 'Python version to set up for running the cleanup script'
    required: false
    default: '3.11'

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Dependencies
      shell: bash
      run: |
        pip install boto3

    - name: Remove Test Copies
      shell: bash
      env:
        INPUT_REGIONS: ${{ inputs.regions }}
        GITHUB_RUN_TAG: ${{ github.repository }}/${{ github.run_id }}
      run: |
        python ${{ github.action_path }}/../cleanup.py \
          --regions "$INPUT_REGIONS" \
          --github-run "$GITHUB_RUN_TAG"
