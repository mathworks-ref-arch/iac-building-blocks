name: 'Publish AMI'
description: 'Copies a source AMI to multiple regions, optionally makes the copies public, and outputs a CloudFormation RegionMap.'
inputs:
  ami_id:
    description: 'The Source AMI ID'
    required: true
  source_ami_region:
    description: 'The region where the source AMI exists'
    required: true
  target_ami_regions:
    description: 'Comma-separated list of regions to publish the AMI to (e.g. us-east-2,eu-west-1)'
    required: true
  matlab_version:
    description: 'Used for naming the AMIs'
    required: true
  refarch_type:
    description: 'Used for naming the AMIs'
    required: true
  test_mode:
    description: 'If true, skips AWS calls and returns mock data'
    required: false
    default: true
  make_public:
    description: 'If true, makes the AMIs in the RegionMap and their snapshots public. If false, the copies are tagged as test copies'
    required: false
    default: 'false'
  timeout_minutes:
    description: 'How long to wait in total for the copies to become available'
    required: false
    default: '45'
  python_version:
    description: 'Python version to set up for running the publish script'
    required: false
    default: '3.11'

outputs:
  region_map_json:
    description: "RegionMap object as a JSON string: { region: { AMI: id } }, with a placeholder for regions without a published AMI"
    value: ${{ steps.publish.outputs.region_map_json }}
  copies_json:
    description: "JSON list of { region, ami_id, snapshot_ids, state } for the target regions; state is created, reused or source"
    value: ${{ steps.publish.outputs.copies_json }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Dependencies
      shell: bash
      run: |
        pip install boto3

    - name: Run Publish Script
      id: publish
      shell: bash
      env:
        INPUT_AMI: ${{ inputs.ami_id }}
        INPUT_SRC: ${{ inputs.source_ami_region }}
        INPUT_DEST: ${{ inputs.target_ami_regions }}
        INPUT_VER: ${{ inputs.matlab_version }}
        INPUT_REFARCH_TYPE: ${{ inputs.refarch_type }}
        INPUT_TEST: ${{ inputs.test_mode }}
        INPUT_PUBLIC: ${{ inputs.make_public }}
        INPUT_TIMEOUT: ${{ inputs.timeout_minutes }}
      run: |
        # Construct flags for test mode and public copies
        TEST_FLAG=""
        if [ "$INPUT_TEST" == "true" ]; then
          TEST_FLAG="--test-mode"
        fi
        PUBLIC_FLAG=""
        if [ "$INPUT_PUBLIC" == "true" ]; then
          PUBLIC_FLAG="--make-public"
        fi

        python ${{ github.action_path }}/publish.py \
          --ami-id "$INPUT_AMI" \
          --src-region "$INPUT_SRC" \
          --dest-regions "$INPUT_DEST" \
          --version "$INPUT_VER" \
          --refarch-type "$INPUT_REFARCH_TYPE" \
          --timeout-minutes "$INPUT_TIMEOUT" \
          $TEST_FLAG $PUBLIC_FLAG