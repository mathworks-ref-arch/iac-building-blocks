# Copyright 2026 The MathWorks, Inc.
name: 'Deploy CloudFormation Stack'
description: 'Downloads template, maps parameters, and deploys stack'

inputs:
  compiled_template_file_path:
    description: "Path to the already-compiled CloudFormation template to deploy"
    required: true
  refarch_type:
    description: "Deployment architecture type (e.g., ps-linux, matlab-linux)"
    required: true
  region:
    description: "AWS region to deploy the stack into"
    required: true
  stack_name:
    description: "Unique name for the temporary CloudFormation stack"
    required: true
  vpc_id:
    description: "VPC to deploy the stack into"
    required: true
  subnet_id:
    description: "Subnet to deploy the stack into"
    required: true
  key_pair_name:
    description: "Name of the pre-provisioned AWS EC2 key pair for instance access"
    required: true
  template_staging_bucket:
    description: |
      S3 bucket used to stage the template when it is too large to submit
      inline. CloudFormation caps --template-body at 51200 bytes, so any
      template above that has to be passed by URL instead. Only required for
      those; smaller templates are submitted inline exactly as before.

      Use one dedicated bucket in the deploy region, carrying a lifecycle rule
      that expires the cfn-staging/ prefix. Staged copies are left for that rule
      to remove rather than being deleted by this action, so a bucket without
      the rule will accumulate templates.
    required: false
    default: ''

outputs:
  stack_outputs:
    description: "JSON string of stack outputs"
    value: ${{ steps.outputs.outputs.STACK_OUTPUTS }}

runs:
  using: "composite"
  steps:
    - name: Validate Inputs
      shell: bash
      env:
        REFARCH_TYPE: ${{ inputs.refarch_type }}
        CONFIG_FILE: "${{ github.action_path }}/refarch-type-mappings.json"
      run: |
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "::error::refarch-type-mappings.json not found at $CONFIG_FILE"
          exit 1
        fi
        if ! jq -e ".\"$REFARCH_TYPE\"" "$CONFIG_FILE" > /dev/null 2>&1; then
          AVAILABLE=$(jq -r 'keys | join(", ")' "$CONFIG_FILE")
          echo "::error::Unknown refarch_type '$REFARCH_TYPE'. Available types: $AVAILABLE"
          exit 1
        fi

    - name: Get Runner Public IP
      id: get-ip
      shell: bash
      run: |
        IP=$(curl -fsS --retry 3 --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')
        if ! [[ "$IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Failed to resolve runner public IPv4 (got: '$IP')"
          exit 1
        fi
        echo "ipv4=$IP" >> "$GITHUB_OUTPUT"

    - name: Generate Stack Password
      id: gen-password
      shell: bash
      run: |
        # Build a 20-char password that satisfies all known MATLAB / NLM regexes:
        # >=14 chars, includes upper, lower, digit, and special character.
        # Read a bounded block from /dev/urandom before filtering: piping an
        # unbounded stream straight into `head -c` makes `tr` die on SIGPIPE
        # when head closes the pipe, which aborts the step under pipefail.
        gen() { LC_ALL=C head -c 8192 /dev/urandom | LC_ALL=C tr -dc "$1" | head -c "$2"; }
        UPPER=$(gen 'A-Z' 1)
        LOWER=$(gen 'a-z' 1)
        DIGIT=$(gen '0-9' 1)
        SPECIAL=$(gen '!@#%^_+=-' 1)
        REST=$(gen 'A-Za-z0-9' 16)
        PASSWORD="${UPPER}${LOWER}${DIGIT}${SPECIAL}${REST}"
        if [ "${#PASSWORD}" -lt 14 ]; then
          echo "::error::Generated password too short (${#PASSWORD} chars); entropy source may be unavailable"
          exit 1
        fi
        echo "::add-mask::$PASSWORD"
        echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

    - name: Prepare Parameters JSON
      id: prep-params
      shell: bash
      env:
        REFARCH_TYPE: ${{ inputs.refarch_type }}
        VPC: ${{ inputs.vpc_id }}
        SUBNET: ${{ inputs.subnet_id }}
        KEY: ${{ inputs.key_pair_name }}
        CLIENT_IP: "${{ steps.get-ip.outputs.ipv4 }}/32"
        STACK_PASSWORD: ${{ steps.gen-password.outputs.password }}
        CONFIG_FILE: "${{ github.action_path }}/refarch-type-mappings.json"
        TEMPLATE_FILE: ${{ inputs.compiled_template_file_path }}
      run: |
        KEY_PARAM=$(jq -r ".\"$REFARCH_TYPE\".key_param" $CONFIG_FILE)
        VPC_PARAM=$(jq -r ".\"$REFARCH_TYPE\".vpc_param" $CONFIG_FILE)
        SUBNET_PARAM=$(jq -r ".\"$REFARCH_TYPE\".subnet_param" $CONFIG_FILE)
        CLIENT_IP_PARAM=$(jq -r ".\"$REFARCH_TYPE\".client_ip_param" $CONFIG_FILE)

        jq ".\"$REFARCH_TYPE\".defaults" $CONFIG_FILE > params.json

        jq --arg k "$VPC_PARAM" --arg v "$VPC" '. += [{"ParameterKey": $k, "ParameterValue": $v}]' params.json > tmp.json && mv tmp.json params.json
        jq --arg k "$SUBNET_PARAM" --arg v "$SUBNET" '. += [{"ParameterKey": $k, "ParameterValue": $v}]' params.json > tmp.json && mv tmp.json params.json
        jq --arg k "$KEY_PARAM" --arg v "$KEY" '. += [{"ParameterKey": $k, "ParameterValue": $v}]' params.json > tmp.json && mv tmp.json params.json
        jq --arg k "$CLIENT_IP_PARAM" --arg v "$CLIENT_IP" '. += [{"ParameterKey": $k, "ParameterValue": $v}]' params.json > tmp.json && mv tmp.json params.json

        # Inject a random password for any template that asks for one. Only
        # Password / ConfirmPassword parameters that the compiled template
        # actually declares are set (added if absent, updated if present), so
        # we never pass an unknown parameter to CloudFormation. The values are
        # masked and never logged, so deployments do not rely on a hardcoded
        # credential.
        jq --arg pw "$STACK_PASSWORD" --slurpfile tmpl "$TEMPLATE_FILE" '
          ($tmpl[0].Parameters // {}) as $tp
          | reduce ["Password", "ConfirmPassword"][] as $name (.;
              if ($tp | has($name)) then
                if any(.[]; .ParameterKey == $name)
                then map(if .ParameterKey == $name then .ParameterValue = $pw else . end)
                else . + [{"ParameterKey": $name, "ParameterValue": $pw}]
                end
              else . end)
        ' params.json > tmp.json && mv tmp.json params.json

        echo "Generated Parameters (passwords redacted by runner masking):"
        cat params.json

    - name: Deploy Stack
      shell: bash
      env:
        STAGING_BUCKET: ${{ inputs.template_staging_bucket }}
      run: |
        TEMPLATE_FILE="${{ inputs.compiled_template_file_path }}"

        if [[ ! -f "$TEMPLATE_FILE" ]]; then
          echo "::error::Template file not found at $TEMPLATE_FILE"
          exit 1
        fi

        # CloudFormation rejects an inline --template-body over 51200 bytes, so
        # anything larger has to be staged in S3 and passed by URL. Templates
        # under the limit keep going inline, which needs no bucket.
        INLINE_LIMIT=51200
        TEMPLATE_SIZE=$(wc -c < "$TEMPLATE_FILE")
        echo "Template size: ${TEMPLATE_SIZE} bytes (inline limit ${INLINE_LIMIT})"

        if [ "$TEMPLATE_SIZE" -le "$INLINE_LIMIT" ]; then
          TEMPLATE_ARG=(--template-body "file://$TEMPLATE_FILE")
        else
          if [ -z "$STAGING_BUCKET" ]; then
            echo "::error::Template is ${TEMPLATE_SIZE} bytes, over CloudFormation's ${INLINE_LIMIT}-byte inline limit. Set the template_staging_bucket input (for example from a TEMPLATE_STAGING_BUCKET repository variable) so it can be staged in S3 and passed by URL."
            exit 1
          fi
          TEMPLATE_KEY="cfn-staging/${{ inputs.stack_name }}/$(basename "$TEMPLATE_FILE")"
          echo "Staging template at s3://${STAGING_BUCKET}/${TEMPLATE_KEY}"
          aws s3 cp "$TEMPLATE_FILE" "s3://${STAGING_BUCKET}/${TEMPLATE_KEY}" \
            --region ${{ inputs.region }}
          # The staged copy is left in place for the bucket's lifecycle rule on
          # the cfn-staging/ prefix to expire. Deleting it here would need
          # s3:DeleteObject on the role and would still leave objects behind
          # whenever a run is cancelled before the cleanup step.
          TEMPLATE_ARG=(--template-url "https://${STAGING_BUCKET}.s3.${{ inputs.region }}.amazonaws.com/${TEMPLATE_KEY}")
        fi

        aws cloudformation create-stack \
          --stack-name ${{ inputs.stack_name }} \
          "${TEMPLATE_ARG[@]}" \
          --region ${{ inputs.region }} \
          --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
          --parameters file://params.json

        echo "Waiting for stack creation..."
        if ! aws cloudformation wait stack-create-complete \
          --stack-name ${{ inputs.stack_name }} \
          --region ${{ inputs.region }} 2>&1; then
          echo "::error::CloudFormation stack creation failed for ${{ inputs.stack_name }}"
          aws cloudformation describe-stack-events \
            --stack-name ${{ inputs.stack_name }} \
            --region ${{ inputs.region }} \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
            --output table
          exit 1
        fi

    - name: Retrieve Stack Outputs
      id: outputs
      shell: bash
      run: |
        # Get Outputs as a simplified JSON object { "OutputKey": "OutputValue" }
        OUTPUTS=$(aws cloudformation describe-stacks \
          --stack-name ${{ inputs.stack_name }} \
          --region ${{ inputs.region }} \
          --query "Stacks[0].Outputs" | \
          jq -c 'reduce .[] as $item ({}; . + {($item.OutputKey): $item.OutputValue})')
        
        echo "STACK_OUTPUTS=$OUTPUTS" >> $GITHUB_OUTPUT