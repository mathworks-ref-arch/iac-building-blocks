name: 'Module: Commit Release Files'

on:
  workflow_call:
    inputs:
      target_versions:
        required: true
        type: string
      s3_bucket_url:
        required: true
        type: string
      dual_repo_url:
        required: true
        type: string
      artifacts_path:
        required: true
        type: string
      release_template_name_pattern:
        required: true
        type: string
      release_template_file_name:
        description: "Overrides the meta-template file name the release job recorded"
        type: string
        default: ''
    outputs:
      release_sha:
        description: "Commit that holds the release files: the branch head after this job"
        value: ${{ jobs.commit-files.outputs.release_sha }}

jobs:
  commit-files:
    name: Update Repo Files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One commit-back at a time per repository.
    concurrency:
      group: commit-back-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      release_sha: ${{ steps.head.outputs.sha }}

    steps:
      - name: Check Branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFAULT_BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Release files are committed only from the default branch ${DEFAULT_BRANCH}, not ${GITHUB_REF}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The branch tip, so a re-run builds on what an earlier attempt pushed.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ inputs.artifacts_path }}

      - name: Flatten Artifacts
        shell: bash
        run: |
          # Flatten the artifact structure so the script finds them easily
          find ${{ inputs.artifacts_path }} -name "${{ inputs.release_template_name_pattern }}" -exec mv {} ${{ inputs.artifacts_path }}/ \;

      - name: Resolve Template File Name
        id: template_name
        shell: bash
        env:
          OVERRIDE: ${{ inputs.release_template_file_name }}
          ARTIFACTS: ${{ inputs.artifacts_path }}
        run: |
          # The release job records the meta-template's file name; the input overrides it.
          NAME="$OVERRIDE"
          if [ -z "$NAME" ]; then
            NAMES=$(find "$ARTIFACTS" -name '*-release-template-name.txt' -exec cat {} \; | sort -u)
            if [ "$(grep -c . <<< "$NAMES")" != 1 ]; then
              echo "::error::Expected one recorded release template name, found: $(paste -sd, - <<< "${NAMES:-none}"). Set release_template_file_name to choose one."
              exit 1
            fi
            NAME="$NAMES"
          fi
          echo "Release template file name: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Check For Newer Releases
        shell: bash
        env:
          TARGET_VERSIONS: ${{ inputs.target_versions }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Release commits name their run; never replace files a newer run released.
          for VER in $(echo "$TARGET_VERSIONS" | jq -r '.[]'); do
            LAST_RUN=$(git log -1 --format=%B -- "releases/${VER}/" | sed -n 's/.*(run \([0-9]*\)).*/\1/p' | head -1)
            if [ -n "$LAST_RUN" ] && [ "$LAST_RUN" -gt "$RUN_ID" ]; then
              echo "::error::releases/${VER} was last released by run ${LAST_RUN}, which is newer than this run (${RUN_ID})."
              exit 1
            fi
          done

      - name: Generate Release Files
        id: process
        uses: mathworks-ref-arch/iac-building-blocks/.github/actions/process-release-files@experimental
        with:
          target_versions: ${{ inputs.target_versions }}
          artifact_path: '${{ inputs.artifacts_path }}'
          s3_bucket_url: ${{ inputs.s3_bucket_url }}
          dual_repo_url: ${{ inputs.dual_repo_url }}
          template_file_name: ${{ steps.template_name.outputs.name }}
          python_version: ${{ vars.PYTHON_VERSION || '3.11' }}

      - name: Commit Message
        id: message
        shell: bash
        env:
          TARGET_VERSIONS: ${{ inputs.target_versions }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "text=$(echo "$TARGET_VERSIONS" | jq -r 'join(", ")') release! (run ${RUN_ID})" >> "$GITHUB_OUTPUT"

      - name: Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: ${{ steps.message.outputs.text }}
          file_pattern: ${{ steps.process.outputs.files }}

      - name: Record Release Commit
        id: head
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
